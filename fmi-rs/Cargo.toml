[package]
name = "fmi-rs"
workspace = ".."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Functional Mock-up Interface (FMI) for Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fmi", "simulation", "fmu"]
categories = ["science", "simulation", "api-bindings"]

[features]
default = ["zip"]
schema = []
sundials = []
test-fixtures = ["dep:reqwest", "dep:anyhow"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
zip = ["dep:zip"]

[dependencies]
anyhow = { version = "1.0", optional = true }
approx = "0.5"
askama = "0.16"
colored = "3.1"
csv = "1.4"
itertools = "0.15"
fmi-rs-macros = { path = "../fmi-rs-macros" }
libc = "0.2"
libloading = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.13", features = ["blocking"], optional = true }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
url = "2"
wasmtime = { version = "45", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "45", optional = true }
zip = { version = "8.6", optional = true }

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
fmi-rs = { package = "fmi-rs", path = ".", features = ["test-fixtures", "sundials"] }
rstest = "0.26"

[lints.clippy]
# Explicit panicking mechanisms
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
panic_in_result_fn = "warn"

# Implicit panicking operations
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# Additional safety lints for fallible operations
out_of_bounds_indexing = "warn"
string_slice = "warn"
