[package]
name = "fmi-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Functional Mock-up Interface (FMI) for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/CATIA-Systems/fmi-rs"
readme = "README.md"
keywords = ["fmi", "simulation", "fmu"]
categories = ["science", "simulation", "api-bindings"]

[features]
default = ["zip"]
schema = []
sundials = []
test-fixtures = ["dep:reqwest", "dep:anyhow"]
zip = ["dep:zip"]

[dependencies]
anyhow = { version = "1.0", optional = true }
approx = "0.5"
askama = "0.16"
colored = "3.1"
csv = "1.4"
itertools = "0.15"
libc = "0.2"
libloading = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.13", features = ["blocking"], optional = true }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.21"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
url = "2"
zip = { version = "8.6", optional = true }

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
fmi-rs = { package = "fmi-rs", path = ".", features = ["test-fixtures", "sundials"] }
rstest = "0.26"

[lints.clippy]
# Explicit panicking mechanisms
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
panic_in_result_fn = "warn"

# Implicit panicking operations
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# Additional safety lints for fallible operations
out_of_bounds_indexing = "warn"
string_slice = "warn"
