[workspace]
members = ["fmi-rs", "fmi-rs-macros"]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
repository = "https://github.com/CATIA-Systems/fmi-rs"

[workspace.dependencies]
# Path for local workspace builds; version is what `cargo publish` writes for crates.io consumers.
fmi-rs-macros = { version = "0.3.4", path = "fmi-rs-macros" }
