name: Publish to crates.io

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v0.1.0, v0.2.0-alpha, etc.

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run fmi-rs-macros packaging
        run: cargo publish -p fmi-rs-macros --dry-run

      - name: Publish fmi-rs-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fmi-rs-macros

      - name: Wait for crates.io index
        run: sleep 45

      - name: Publish fmi-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fmi-rs
